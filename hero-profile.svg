<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <radialGradient id="crimsonGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a202c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .cyber-title { font-family: 'Orbitron', 'Segoe UI', sans-serif; font-weight: 800; font-size: 25px; fill: #ffffff; letter-spacing: 0.5px; }
      .cyber-sub { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #ff1e42; font-weight: 600; letter-spacing: 0.2px; }
      .cyber-desc { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .cyber-badge { font-family: 'Fira Code', monospace; font-size: 10.5px; fill: #cbd5e1; font-weight: 600; }
      .cyber-metric-val { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 18px; fill: #ffffff; }
      .cyber-metric-lbl { font-family: 'Fira Code', monospace; font-size: 9px; fill: #64748b; font-weight: 600; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="846" height="376" rx="20" fill="url(#bgGrad)" stroke="#ff1e42" stroke-opacity="0.4" stroke-width="2" />
  
  <!-- Ambient Lights -->
  <rect x="2" y="2" width="846" height="376" rx="20" fill="url(#crimsonGlow)" />
  <rect x="2" y="2" width="846" height="376" rx="20" fill="url(#cyanGlow)" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="380" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="280" y1="0" x2="280" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="520" y1="0" x2="520" y2="380" />
    <line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="160" x2="850" y2="160" />
    <line x1="0" y1="240" x2="850" y2="240" />
    <line x1="0" y1="320" x2="850" y2="320" />
  </g>

  <!-- Top Bar Terminal Info -->
  <g transform="translate(35, 30)">
    <circle cx="8" cy="8" r="5" fill="#ff5f56" />
    <circle cx="24" cy="8" r="5" fill="#ffbd2e" />
    <circle cx="40" cy="8" r="5" fill="#27c93f" />
    <text x="65" y="12" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">github.com/Guimemee // README.md (active)</text>
    <rect x="670" y="0" width="120" height="18" rx="9" fill="#ff1e42" fill-opacity="0.15" stroke="#ff1e42" stroke-opacity="0.4" />
    <circle cx="682" cy="9" r="3" fill="#ff1e42" filter="url(#neonFilter)" />
    <text x="692" y="13" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#ff1e42">FIAP ENG 22-26</text>
  </g>

  <line x1="35" y1="58" x2="815" y2="58" stroke="#1e293b" stroke-width="1" />

  <!-- LEFT COLUMN: Profile Info -->
  <g transform="translate(45, 95)">
    <!-- Main Title -->
    <text x="0" y="24" class="cyber-title">OLÁ, SOU GUILHERME MACÁRIO 👋</text>
    
    <!-- Subtitle (Conforme solicitado) -->
    <text x="0" y="50" class="cyber-sub">// FIAP Eng. de Computação • Data Engineer • Data Science • IA • ML</text>
    
    <!-- Description (Sobre Mim) -->
    <text x="0" y="78" class="cyber-desc">Sempre fui fascinado pelo ecossistema tecnológico, hardware e pela engenharia</text>
    <text x="0" y="96" class="cyber-desc">que faz os dispositivos funcionarem. Estudando engenharia reversa e mecânica interna.</text>
    <text x="0" y="114" class="cyber-desc">Graduando FIAP com formações Alura em Data Science, IA e Analytics.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 140)">
      <!-- Badge 1: Python AI -->
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.4" />
      <circle cx="10" cy="12" r="3" fill="#fbbf24" />
      <text x="20" y="16" class="cyber-badge">Python (AI &amp; POO)</text>

      <!-- Badge 2: Data Engineering -->
      <rect x="140" y="0" width="125" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" />
      <circle cx="150" cy="12" r="3" fill="#38bdf8" />
      <text x="160" y="16" class="cyber-badge">Data Engineering</text>

      <!-- Badge 3: IA & ML -->
      <rect x="275" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4" />
      <circle cx="285" cy="12" r="3" fill="#34d399" />
      <text x="295" y="16" class="cyber-badge">IA &amp; ML / LLMs</text>

      <!-- Badge 4: Hardware & IoT -->
      <rect x="390" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" />
      <circle cx="400" cy="12" r="3" fill="#c084fc" />
      <text x="410" y="16" class="cyber-badge">Hardware &amp; IoT</text>
    </g>

    <!-- Metric Counters (Power BIs privados contabilizados) -->
    <g transform="translate(0, 185)">
      <!-- Metric 1: Power BIs Privados -->
      <rect x="0" y="0" width="125" height="46" rx="8" fill="#0c101a" stroke="#eab308" stroke-opacity="0.4" />
      <text x="12" y="24" class="cyber-metric-val" fill="#facc15">155+</text>
      <text x="12" y="38" class="cyber-metric-lbl">PBIX (Privados 🔒)</text>

      <!-- Metric 2: SQL Scripts -->
      <rect x="135" y="0" width="115" height="46" rx="8" fill="#0c101a" stroke="#1e293b" />
      <text x="147" y="24" class="cyber-metric-val">45</text>
      <text x="147" y="38" class="cyber-metric-lbl">SQL DW Scripts</text>

      <!-- Metric 3: Challenges FIAP -->
      <rect x="260" y="0" width="115" height="46" rx="8" fill="#0c101a" stroke="#1e293b" />
      <text x="272" y="24" class="cyber-metric-val">5</text>
      <text x="272" y="38" class="cyber-metric-lbl">Challenges FIAP</text>

      <!-- Metric 4: Commits -->
      <rect x="385" y="0" width="115" height="46" rx="8" fill="#0c101a" stroke="#1e293b" />
      <text x="397" y="24" class="cyber-metric-val">1.850+</text>
      <text x="397" y="38" class="cyber-metric-lbl">Commits / Contrib</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: ROBOTIC MASCOT (Vector Art) -->
  <g transform="translate(580, 85)">
    <circle cx="130" cy="130" r="110" fill="#ff1e42" fill-opacity="0.12" filter="url(#neonFilter)" />

    <path d="M80 110 C80 50 180 50 180 110" stroke="#1e293b" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M85 110 C85 60 175 60 175 110" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none" />

    <path d="M75 235 C75 180 100 165 130 165 C160 165 185 180 185 235 Z" fill="#0b0e14" stroke="#1e293b" stroke-width="2" />

    <rect x="75" y="65" width="110" height="100" rx="42" fill="#1e2533" stroke="#334155" stroke-width="3" />
    <rect x="85" y="80" width="90" height="72" rx="30" fill="url(#visorGrad)" stroke="#0f172a" stroke-width="2" />

    <polygon points="102,105 120,99 117,114 102,111" fill="#ff1e42" filter="url(#neonFilter)" />
    <polygon points="158,105 140,99 143,114 158,111" fill="#ff1e42" filter="url(#neonFilter)" />

    <polyline points="108,130 115,135 122,130 130,136 138,130 145,135 152,130" fill="none" stroke="#ff1e42" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonFilter)" />

    <rect x="60" y="90" width="22" height="45" rx="10" fill="#111827" stroke="#334155" stroke-width="2" />
    <circle cx="71" cy="112" r="10" fill="#0f172a" stroke="#ff1e42" stroke-width="2" filter="url(#neonFilter)" />

    <rect x="178" y="90" width="22" height="45" rx="10" fill="#111827" stroke="#334155" stroke-width="2" />
    <circle cx="189" cy="112" r="10" fill="#0f172a" stroke="#00d2ff" stroke-width="2" filter="url(#neonFilter)" />

    <g transform="translate(45, 10)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#0b0e14" stroke="#ff1e42" stroke-opacity="0.6" stroke-width="1.5" />
      <circle cx="12" cy="13" r="3" fill="#ff1e42" filter="url(#neonFilter)" />
      <text x="24" y="17" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#e2e8f0">FIAP ENG: ONLINE</text>
    </g>
  </g>

  <!-- Bottom Prompt Bar -->
  <g transform="translate(35, 345)">
    <text x="0" y="14" font-family="'Fira Code', monospace" font-size="10" fill="#475569">STATUS: ONLINE // FIAP ENG COMPUTAÇÃO &amp; DATA SCIENCE</text>
    <text x="560" y="14" font-family="'Fira Code', monospace" font-size="10" fill="#ff1e42" font-weight="bold">CLIQUE PARA ABRIR O GITPAGE COMPLETO ▶</text>
  </g>
</svg>
